<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학교 랜덤 추첨</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f9f9f9;
  }
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    textarea, input[type="number"] {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      border: 1px solid #ccc;
      padding: 15px;
      background-color: #fff;
      border-radius: 5px;
    }
    .result h3 {
      text-align: center;
      color: #007bff;
    }
    .result p {
      text-align: center;
      margin: 10px 0;
    }
    #resultText {
      width: 100%;
      height: 60px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
    }
  </style>
</head>
<body>

  <h1>학교 랜덤 추첨</h1>

  <textarea id="inputIds" placeholder="콤마(,)로 구분된 전체 학교명을 입력하세요"></textarea>
  <input type="number" id="drawCountInput" placeholder="추첨할 학교 수를 입력하세요" min="1" />
  <button onclick="drawWinners()">추첨</button>

  <div class="result">
    <h3>추첨 결과</h3>
    <p id="statusText"></p>
    <textarea id="resultText" readonly></textarea>
    <button onclick="copyToClipboard()">📋 복사하기</button>
  </div>

  <script>
    function drawWinners() {
      const mustInclude = ["강남고", "서초고", "노원고"];
      const mustExclude = ["비공개고", "테스트고"];

      const inputText = document.getElementById('inputIds').value;
      const drawCount = parseInt(document.getElementById('drawCountInput').value);

      if (isNaN(drawCount) || drawCount <= 0) {
        alert("추첨할 학교 수를 올바르게 입력하세요.");
        return;
      }

      let allInput = inputText.split(',').map(id => id.trim()).filter(id => id !== '');
      allInput = [...new Set(allInput)];

      const cleanedList = allInput.filter(id => !mustExclude.includes(id));
      const validMustInclude = mustInclude.filter(id => cleanedList.includes(id));
      const remainingCandidates = cleanedList.filter(id => !validMustInclude.includes(id));
      const remainingToDraw = drawCount - validMustInclude.length;

      if (remainingToDraw < 0) {
        alert(`반드시 포함되어야 하는 학교 수(${validMustInclude.length})가 추첨 개수(${drawCount})보다 많습니다.`);
        return;
      }

      const shuffled = remainingCandidates.sort(() => Math.random() - 0.5);
      const selectedRandom = shuffled.slice(0, remainingToDraw);
      const finalList = validMustInclude.concat(selectedRandom).sort((a, b) => a.localeCompare(b, "ko"));

      document.getElementById('statusText').innerText = 
        `총 입력: ${allInput.length}개, 최종 추첨: ${finalList.length}개`;

      document.getElementById('resultText').value = finalList.join(', ');
    }

    function copyToClipboard() {
      const resultText = document.getElementById('resultText');
      resultText.select();
      resultText.setSelectionRange(0, 99999); // 모바일 호환

      try {
        document.execCommand("copy");
        alert("복사되었습니다!");
      } catch (err) {
        alert("복사에 실패했습니다. 수동으로 복사해 주세요.");
      }
    }
  </script>

</body>
</html>
