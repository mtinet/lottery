<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>학교 랜덤 추첨</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .buttons {
      text-align: center;
      margin-bottom: 20px;
    }
    .buttons button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
    }
    .buttons button:hover {
      background-color: #0056b3;
    }
    .result {
      border: 1px solid #ccc;
      padding: 15px;
      background-color: #fff;
      border-radius: 5px;
    }
    .result h3 {
      text-align: center;
      color: #007bff;
    }
    .result p {
      text-align: center;
      margin: 10px 0;
    }
    .result ul {
      list-style: none;
      padding: 0;
    }
    .result li {
      font-size: 14px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

<h1>학교 랜덤 추첨</h1>
<textarea id="inputIds" placeholder="콤마(,)로 구분된 학교명을 입력하세요"></textarea>

<div class="buttons">
  <p><strong>몇 개 학교를 뽑을까요?</strong></p>
  <button onclick="drawWinners(10)">10개</button>
  <button onclick="drawWinners(15)">15개</button>
  <button onclick="drawWinners(20)">20개</button>
  <button onclick="drawWinners(24)">24개</button>
</div>

<div class="result">
  <h3>추첨 결과</h3>
  <p id="statusText"></p>
  <ul id="selectedWinners"></ul>
</div>

<script>
  function drawWinners(drawCount) {
    const mustInclude = [
      "강남고", "서초고", "노원고" // 항상 포함될 학교
    ];

    const mustExclude = [
      "비공개고", "테스트학교" // 제외될 학교
    ];

    const input = document.getElementById('inputIds').value;
    let ids = input.split(',').map(id => id.trim()).filter(id => id !== '');
    const totalCount = ids.length;

    const forbidden = ids.filter(id => mustExclude.includes(id));
    if (forbidden.length > 0) {
      alert(`다음 학교는 제외되어야 합니다: ${forbidden.join(', ')}`);
      return;
    }

    const uniqueIds = [...new Set(ids)];
    const filtered = uniqueIds.filter(id => !mustInclude.includes(id) && !mustExclude.includes(id));
    const remainingToSelect = drawCount - mustInclude.length;

    if (remainingToSelect < 0) {
      alert(`무조건 포함될 학교 수(${mustInclude.length})가 추첨 인원(${drawCount)보다 많습니다.`);
      return;
    }

    const shuffled = filtered.sort(() => Math.random() - 0.5);
    const randomSelection = shuffled.slice(0, remainingToSelect);
    const finalWinners = mustInclude.concat(randomSelection).sort((a, b) => a.localeCompare(b, "ko"));

    document.getElementById('statusText').innerText = `총 입력 학교: ${totalCount}개, 추첨된 학교: ${finalWinners.length}개`;
    document.getElementById('selectedWinners').innerHTML = finalWinners.map(id => `<li>${id}</li>`).join('');
  }
</script>

</body>
</html>
